DEFAULT chan
PROMPT 0
TIMEOUT 20
SAY Booting Chan Linux (clover)...

LABEL chan
  LINUX /boot/vmlinuz
  INITRD /boot/chan.cpio.gz
  # tty0 last => it is /dev/console, so the shell shows in the VM window.
  # ttyS0 kept too, so a headless/serial boot also works.
  APPEND console=ttyS0,115200 console=tty0 quiet
